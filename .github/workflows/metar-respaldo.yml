name: Respaldo de actualizacion METAR

# Programador secundario con minutos distintos al workflow principal.
# Sigue siendo GitHub Actions: reduce dependencia de un unico cron,
# pero no reemplaza un scheduler externo con garantia de ejecucion.
on:
  schedule:
    - cron: "3,23,43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  respaldo:
    uses: ./.github/workflows/actualizar-metar.yml
    permissions:
      contents: write
