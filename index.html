  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #e8edf3;
      --panel: #f7f9fc;
      --card: #ffffff;
      --text: #0f2f57;
      --muted: #52657d;
      --accent: #1f6feb;
      --accent-dark: #133f75;
      --line: #d7e0ea;
      --soft: #eef3f8;
      --shadow: 0 12px 28px rgba(15, 47, 87, 0.10);
    }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    header {
      padding: 16px 12px 8px;
    }

    header .wrap {
      width: min(1380px, calc(100% - 20px));
      margin: 0 auto;
      background: linear-gradient(180deg, #f8fbff 0%, #eef4fb 100%);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
    }

    .header-text {
      min-width: 0;
    }

    .header-text h1 {
      margin: 0;
      font-size: clamp(1.35rem, 2.2vw, 2rem);
      font-weight: 800;
      line-height: 1.2;
      color: var(--text);
    }

    .header-text p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.4;
      font-weight: 600;
    }

    .header-logo {
      width: 94px;
      height: 94px;
      object-fit: contain;
      flex: 0 0 94px;
      display: block;
    }

    main {
      width: min(1380px, calc(100% - 20px));
      margin: 0 auto 12px;
    }

    .panel {
      background: var(--panel);
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 18px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .barra-controles {
      display: grid;
      grid-template-columns: minmax(0, 1fr) max-content;
      gap: 22px;
      align-items: center;
    }
.formulario {
      display: grid;
      grid-template-columns: repeat(4, minmax(130px, 1fr));
      gap: 12px;
      align-items: end;
      min-width: 0;
    }

    .boton-mapa {
      width: min(260px, 100%);
      justify-self: center;
      grid-column: 1 / -1;
    }

    .enlace-mapa {
      display: none;
      justify-self: center;
      grid-column: 1 / -1;
      color: var(--accent-dark);
      font-size: 14px;
      font-weight: 800;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .enlace-mapa.visible {
      display: inline-block;
    }

    .encuadre {
      display: grid;
      grid-template-columns: auto auto;
      gap: 10px;
      align-items: stretch;
      align-self: center;
      min-width: max-content;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
      justify-content: center;
    }

    label {
      font-size: 14px;
      font-weight: 800;
      color: var(--text);
    }

    input,
    select,
    button {
      width: 100%;
      min-width: 0;
      min-height: 42px;
      padding: 9px 11px;
      font-size: 15px;
      border-radius: 10px;
    }

    input,
    select {
      border: 1px solid #cfd8e3;
      background: #fff;
      color: var(--text);
    }

    input:focus,
    select:focus,
    button:focus-visible {
      outline: 3px solid rgba(31, 111, 235, 0.20);
      outline-offset: 2px;
    }

    button {
      background: var(--accent-dark);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 700;
      transition: background 0.15s ease, transform 0.15s ease;
      box-shadow: 0 6px 16px rgba(19, 63, 117, 0.18);
    }

    button:hover {
      background: #0f3058;
    }

    button:active {
      transform: translateY(1px);
    }

    .recorte-ogimet {
      --desplazamiento-x: 0px;
      --desplazamiento-y: 0px;
      --escala-mapa: 0.72;
      --ancho-lienzo: 1296px;
      --alto-lienzo: 1044px;
      width: 100%;
      height: calc(100vh - 220px);
      min-height: 680px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #dbe8f2;
      box-shadow: var(--shadow);
      scroll-margin-top: 10px;
      position: relative;
    }

    .recorte-ogimet:focus {
      outline: 3px solid rgba(15, 47, 87, 0.20);
      outline-offset: 3px;
    }

    .lienzo-ogimet {
      width: var(--ancho-lienzo);
      height: var(--alto-lienzo);
      min-width: 100%;
      min-height: 100%;
      position: relative;
    }

    .estado-inicial {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      padding: 24px;
      background: #dbe8f2;
      z-index: 2;
      pointer-events: none;
    }

    .mensaje-inicial {
      width: min(780px, 100%);
      padding: 28px;
      border: 1px solid #cbd9e7;
      border-radius: 16px;
      background: #ffffff;
      color: var(--text);
      font-size: clamp(1rem, 2vw, 1.28rem);
      font-weight: 800;
      line-height: 1.45;
      text-align: center;
      box-shadow: 0 10px 24px rgba(15, 47, 87, 0.10);
    }

    .recorte-ogimet.mapa-cargado .estado-inicial {
      display: none;
    }

    .lienzo-ogimet iframe {
      width: 1800px;
      height: 1450px;
      border: none;
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(var(--desplazamiento-x), var(--desplazamiento-y)) scale(var(--escala-mapa));
      transform-origin: top left;
    }

    .control-zoom,
    .control-direccional {
      border: 1px solid #cfdbe8;
      border-radius: 14px;
      background: var(--soft);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    }

    .control-zoom {
      align-items: center;
      justify-content: space-between;
      width: 78px;
      padding: 10px;
    }

    .zoom-slider {
      appearance: none;
      writing-mode: vertical-lr;
      direction: rtl;
      width: 14px;
      height: 120px;
      min-height: 120px;
      padding: 0;
      border: 1px solid #9eb7cf;
      border-radius: 999px;
      background: linear-gradient(0deg, #86b7dc, #f3f9fe);
      cursor: pointer;
    }

    .zoom-slider::-webkit-slider-thumb {
      appearance: none;
      width: 24px;
      height: 24px;
      border: 3px solid #ffffff;
      border-radius: 50%;
      background: var(--accent-dark);
      box-shadow: 0 2px 8px rgba(0, 43, 111, 0.25);
    }

    .zoom-slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border: 3px solid #ffffff;
      border-radius: 50%;
      background: var(--accent-dark);
      box-shadow: 0 2px 8px rgba(0, 43, 111, 0.25);
    }

    .control-direccional {
      display: grid;
      gap: 6px;
      justify-items: start;
      padding: 10px;
    }

    .pad-direccional {
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(3, 44px);
      gap: 6px;
      justify-content: start;
    }

    .boton-flecha {
      display: grid;
      place-items: center;
      min-height: 44px;
      padding: 0;
      border: 1px solid #9eb7cf;
      background: #f7fbff;
      color: var(--accent-dark);
      box-shadow: none;
    }

    .boton-flecha:hover {
      background: #e8f2fb;
    }

    .boton-flecha::before {
      content: "";
      width: 0;
      height: 0;
      border-style: solid;
    }

    .flecha-arriba { grid-column: 2; grid-row: 1; }
    .flecha-arriba::before { border-width: 0 9px 12px; border-color: transparent transparent var(--accent-dark); }
    .flecha-izquierda { grid-column: 1; grid-row: 2; }
    .flecha-izquierda::before { border-width: 9px 12px 9px 0; border-color: transparent var(--accent-dark) transparent transparent; }
    .flecha-derecha { grid-column: 3; grid-row: 2; }
    .flecha-derecha::before { border-width: 9px 0 9px 12px; border-color: transparent transparent transparent var(--accent-dark); }
    .flecha-abajo { grid-column: 2; grid-row: 3; }
    .flecha-abajo::before { border-width: 12px 9px 0; border-color: var(--accent-dark) transparent transparent; }

    footer {
      width: min(1380px, calc(100% - 20px));
      margin: 0 auto 16px;
      padding: 14px 22px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(180deg, #f8fbff 0%, #eef4fb 100%);
      color: var(--muted);
      box-shadow: var(--shadow);
      text-align: center;
      line-height: 1.4;
      font-size: 0.95rem;
      font-weight: 600;
    }

    footer strong {
      color: var(--text);
    }

    @media (max-width: 1280px) {
      .barra-controles {
        grid-template-columns: minmax(0, 1fr) max-content;
      }
    }

    @media (max-width: 900px) {
      header .wrap {
        align-items: center;
      }

      .header-logo {
        width: 76px;
        height: 76px;
        flex-basis: 76px;
      }
.barra-controles {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {
      .formulario {
        grid-template-columns: 1fr 1fr;
      }
.encuadre {
        grid-template-columns: auto auto;
        justify-content: start;
      }

      .recorte-ogimet {
        height: 70vh;
        min-height: 560px;
      }

      header .wrap {
        flex-direction: column;
        text-align: center;
      }
    }

    @media (max-width: 460px) {
      .formulario,
      .barra-controles {
        grid-template-columns: 1fr;
      }

      .encuadre {
        grid-template-columns: auto auto;
      }
.header-logo {
        width: 68px;
        height: 68px;
        flex-basis: 68px;
      }
    }
  </style>
</head>

  <main>
    <section class="panel" aria-labelledby="titulo">
      <div class="barra-controles">
        <form class="formulario" onsubmit="mostrarMapa(event)">
          <div class="campo">
            <label for="zona">Zona</label>
            <select id="zona">
              <option value="norte">Norte</option>
              <option value="sur" selected>Sur</option>
              <option value="antartida">Antártida</option>
            </select>
          </div>

          <div class="campo">
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" required>
          </div>

          <div class="campo">
            <label for="hora">Hora UTC</label>
            <select id="hora">
              <option>00</option>
              <option>01</option>
              <option>02</option>
              <option>03</option>
              <option>04</option>
              <option>05</option>
              <option>06</option>
              <option>07</option>
              <option>08</option>
              <option>09</option>
              <option>10</option>
              <option>11</option>
              <option>12</option>
              <option>13</option>
              <option>14</option>
              <option>15</option>
              <option>16</option>
              <option>17</option>
              <option>18</option>
              <option>19</option>
              <option>20</option>
              <option>21</option>
              <option>22</option>
              <option>23</option>
            </select>
          </div>

          <div class="campo">
            <label for="minuto">Minuto</label>
            <select id="minuto">
              <option selected>00</option>
              <option>15</option>
              <option>30</option>
              <option>45</option>
            </select>
          </div>

          <button class="boton-mapa" type="submit">Mostrar mapa</button>
          <a class="enlace-mapa" id="enlaceMapa" href="#mapa-ogimet">Ir al mapa cargado</a>
        </form>

        <div class="encuadre" aria-label="Ajustes de encuadre">
          <div class="campo control-zoom">
            <label for="escalaMapa">Zoom</label>
            <input class="zoom-slider" type="range" id="escalaMapa" min="0.5" max="1" step="0.01" value="0.72">
          </div>

          <div class="campo control-direccional">
            <label>Desplazamiento</label>
            <div class="pad-direccional" aria-label="Mover mapa">
              <button class="boton-flecha flecha-arriba" type="button" data-mover-x="0" data-mover-y="-1" aria-label="Mover arriba"></button>
              <button class="boton-flecha flecha-izquierda" type="button" data-mover-x="-1" data-mover-y="0" aria-label="Mover izquierda"></button>
              <button class="boton-flecha flecha-derecha" type="button" data-mover-x="1" data-mover-y="0" aria-label="Mover derecha"></button>
              <button class="boton-flecha flecha-abajo" type="button" data-mover-x="0" data-mover-y="1" aria-label="Mover abajo"></button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="recorte-ogimet" id="mapa-ogimet" tabindex="-1" aria-label="Mapa OGIMET">
      <div class="estado-inicial" id="estadoInicial">
        <p class="mensaje-inicial">SELECCIONADO EN EL MENU SUPERIOR PODRA NAVEGAR EN LOS DATOS METEOROLOGICOS PARA LA FECHA Y HORA ELEGIDOS</p>
      </div>
      <div class="lienzo-ogimet">
        <iframe id="visorOgimet" title="Mapa meteorológico de OGIMET"></iframe>
      </div>
    </section>
  </main>

  </main>

  <footer>
    <strong>Desarrollado por Mauricio Nicolás Laurizi</strong>
  </footer>

  <script>
    function mostrarMapa(event) {
      if (event) {
        event.preventDefault();
      }

      const fecha = document.getElementById("fecha").value;

      if (!fecha) {
        alert("Seleccione una fecha");
        return;
      }

      const [ano, mes, dia] = fecha.split("-");
      const hora = document.getElementById("hora").value;
      const minuto = document.getElementById("minuto").value;
      const zona = document.getElementById("zona").value;
      const zonas = {
        norte: { lat: "30S", lon: "060W" },
        sur: { lat: "45S", lon: "060W" },
        antartida: { lat: "60S", lon: "060W" }
      };
      const zonaSeleccionada = zonas[zona];

      const url =
        "https://www.ogimet.com/cgi-bin/gmetar?" +
        "esc=4" +
        "&nav=Yes" +
        "&lat=" + zonaSeleccionada.lat +
        "&lon=" + zonaSeleccionada.lon +
        "&proy=orto" +
        "&base=bluem" +
        "&ano=" + ano +
        "&mes=" + mes +
        "&day=" + dia +
        "&hora=" + hora +
        "&min=" + minuto +
        "&vsg=Sg";

      document.getElementById("visorOgimet").src = url;
      recorteOgimet.classList.add("mapa-cargado");
      document.getElementById("enlaceMapa").classList.add("visible");
    }

    const recorteOgimet = document.querySelector(".recorte-ogimet");
    const enlaceMapa = document.getElementById("enlaceMapa");
    const escalaMapa = document.getElementById("escalaMapa");
    const pasoMovimiento = 25;
    let desplazamientoX = 0;
    let desplazamientoY = 0;

    function aplicarEncuadre() {
      const escala = Number(escalaMapa.value);

      recorteOgimet.style.setProperty("--escala-mapa", escalaMapa.value);
      recorteOgimet.style.setProperty("--desplazamiento-x", desplazamientoX + "px");
      recorteOgimet.style.setProperty("--desplazamiento-y", desplazamientoY + "px");
      recorteOgimet.style.setProperty("--ancho-lienzo", 1800 * escala + "px");
      recorteOgimet.style.setProperty("--alto-lienzo", 1450 * escala + "px");
    }

    function moverMapa(deltaX, deltaY) {
      desplazamientoX += deltaX * pasoMovimiento;
      desplazamientoY += deltaY * pasoMovimiento;
      aplicarEncuadre();
    }

    escalaMapa.addEventListener("input", aplicarEncuadre);
    enlaceMapa.addEventListener("click", (event) => {
      event.preventDefault();
      recorteOgimet.scrollIntoView({ behavior: "smooth", block: "start" });
      recorteOgimet.focus({ preventScroll: true });
    });

    document.querySelectorAll("[data-mover-x]").forEach((boton) => {
      boton.addEventListener("click", () => {
        moverMapa(Number(boton.dataset.moverX), Number(boton.dataset.moverY));
      });
    });

    window.addEventListener("DOMContentLoaded", () => {

  document.getElementById("fecha").valueAsDate = new Date();

  const ahora = new Date();
  const horaUTC = String(ahora.getUTCHours()).padStart(2, "0");

  document.getElementById("hora").value = horaUTC;
  document.getElementById("minuto").value = "00";

  aplicarEncuadre();
});
  </script>
