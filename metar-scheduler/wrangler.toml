name = "visualizador-metar-scheduler"
main = "src/worker.js"
compatibility_date = "2026-11-01"

# Se ejecuta desde el programador independiente de Cloudflare.
# El workflow de GitHub conserva su propio schedule como respaldo.
[triggers]
crons = ["4,14,24,34,44,54 * * * *"]

# El secreto se registra con: npx wrangler secret put GITHUB_TOKEN
# NO incluir el token en este archivo ni en el repositorio.

# Registrar ejecuciones y fallos del cron desde Observability de Cloudflare.
[observability]
enabled = true
head_sampling_rate = 1
